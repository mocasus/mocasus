<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0f18"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="240" rx="12" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="840" height="240" rx="12" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Accent line -->
  <rect x="0" y="0" width="840" height="3" rx="1.5" fill="url(#accentLine)"/>

  <!-- Glow orb -->
  <circle cx="740" cy="120" r="120" fill="#3b82f6" opacity="0.04"/>
  <circle cx="740" cy="120" r="60" fill="#06b6d4" opacity="0.06"/>

  <!-- Status -->
  <circle cx="44" cy="52" r="5" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="44" cy="52" r="9" fill="#06b6d4" opacity="0.15"/>

  <!-- Name -->
  <text x="66" y="62" font-family="Inter, -apple-system, sans-serif" font-size="38" font-weight="800" fill="url(#nameGrad)" letter-spacing="-0.5">mocasus</text>

  <!-- Tagline -->
  <text x="44" y="94" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#64748b" letter-spacing="0.5">AUTOMATION ENGINEER &amp; BOT ARCHITECT — BUILDING SYSTEMS THAT SCALE</text>

  <!-- Divider -->
  <line x1="44" y1="118" x2="796" y2="118" stroke="#1e293b" stroke-width="1"/>

  <!-- Stats row -->
  <g font-family="Inter, -apple-system, sans-serif" font-size="13">
    <text x="44" y="148" fill="#475569">REPOS</text>
    <text x="44" y="168" fill="#e2e8f0" font-weight="700" font-size="22">50</text>

    <text x="140" y="148" fill="#475569">STARS</text>
    <text x="140" y="168" fill="#e2e8f0" font-weight="700" font-size="22">200+</text>

    <text x="250" y="148" fill="#475569">INFRA</text>
    <text x="250" y="168" fill="#e2e8f0" font-weight="700" font-size="22">Debian 12</text>

    <text x="400" y="148" fill="#475569">NETWORK</text>
    <text x="400" y="168" fill="#e2e8f0" font-weight="700" font-size="22">Zero-Trust</text>

    <!-- Tech tags -->
    <rect x="44" y="188" width="52" height="22" rx="6" fill="#1e293b"/>
    <text x="70" y="203" fill="#06b6d4" font-size="11" text-anchor="middle" font-weight="600">Python</text>

    <rect x="102" y="188" width="64" height="22" rx="6" fill="#1e293b"/>
    <text x="134" y="203" fill="#3b82f6" font-size="11" text-anchor="middle" font-weight="600">TypeScript</text>

    <rect x="172" y="188" width="34" height="22" rx="6" fill="#1e293b"/>
    <text x="189" y="203" fill="#8b5cf6" font-size="11" text-anchor="middle" font-weight="600">Go</text>

    <rect x="212" y="188" width="52" height="22" rx="6" fill="#1e293b"/>
    <text x="238" y="203" fill="#f59e0b" font-size="11" text-anchor="middle" font-weight="600">Docker</text>

    <rect x="270" y="188" width="46" height="22" rx="6" fill="#1e293b"/>
    <text x="293" y="203" fill="#ec4899" font-size="11" text-anchor="middle" font-weight="600">Linux</text>
  </g>
</svg>
